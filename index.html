<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReiiOFC - Multi-Purpose API Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #07090e; color: #f1f5f9; font-family: sans-serif; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: #10b981; }
  </style>
</head>
<body class="min-h-screen flex flex-col p-3">

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="fixed inset-0 bg-[#07090e] z-50 flex items-center justify-center p-4">
    <form onsubmit="handleLogin(event)" class="w-full max-w-xs bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-3">
      <h2 class="text-xl font-bold text-emerald-400 text-center">&gt;_ Login Hub API</h2>
      <input type="text" id="login-user" placeholder="Username" required class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs">
      <input type="password" id="login-pass" placeholder="Password" required class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs">
      <p id="login-error" class="text-xs text-rose-400 hidden text-center">User/Password salah!</p>
      <button type="submit" class="w-full bg-emerald-500 text-slate-950 font-bold py-2 rounded-xl text-xs">Masuk</button>
    </form>
  </div>

  <!-- DASHBOARD UTAMA -->
  <div id="main-dashboard" class="hidden flex-col gap-4">
    <header class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-3">
      <h1 class="text-lg font-bold text-emerald-400">ReiiOFC API Hub v1.3.3</h1>
      <div class="flex gap-1 w-full sm:w-auto">
        <input type="text" id="base-url-input" placeholder="https://api.kyzznekoo.my.id" class="bg-slate-950 border border-slate-800 p-1.5 rounded text-xs flex-grow font-mono">
        <button onclick="saveBaseUrl()" class="bg-emerald-500 text-slate-950 font-bold px-2.5 rounded text-xs">Konek</button>
        <button onclick="handleLogout()" class="bg-rose-500/20 text-rose-400 font-bold px-2.5 rounded text-xs">Keluar</button>
      </div>
    </header>

    <!-- TABS MENU -->
    <div class="flex flex-wrap gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs font-semibold">
      <button onclick="switchTab('alight')" class="px-3 py-1.5 rounded bg-emerald-500/20 text-emerald-400">⚡ Alight Motion</button>
      <button onclick="switchTab('ai')" class="px-3 py-1.5 rounded text-slate-400">🤖 AI Chat</button>
      <button onclick="switchTab('stalk')" class="px-3 py-1.5 rounded text-slate-400">🔍 Stalker & Anime</button>
      <button onclick="switchTab('maker')" class="px-3 py-1.5 rounded text-slate-400">🎨 Maker & Editor</button>
      <button onclick="switchTab('tools')" class="px-3 py-1.5 rounded text-slate-400">🛠️ Tools</button>
      <button onclick="switchTab('explorer')" class="px-3 py-1.5 rounded text-slate-400">📦 All API Explorer</button>
    </div>

    <!-- 1. ALIGHT MOTION -->
    <section id="view-alight" class="max-w-md mx-auto w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
      <h3 class="font-bold text-center text-sm text-emerald-400">Aktivasi Alight Motion Premium</h3>
      <div>
        <label class="text-[10px] text-slate-400">1. Masukkan Email</label>
        <input type="email" id="am-email" placeholder="nama@gmail.com" class="w-full bg-slate-950 border border-slate-800 p-2 text-xs rounded-lg mt-1">
      </div>
      <button onclick="runAlightMagic()" class="w-full bg-emerald-500 text-slate-950 font-bold py-2 rounded-lg text-xs">Kirim Magic Link</button>
      <hr class="border-slate-800">
      <div>
        <label class="text-[10px] text-slate-400">2. Tempel Link dari Inbox/Spam Email</label>
        <input type="url" id="am-link" placeholder="https://alight-creative.firebaseapp.com/__/auth/..." class="w-full bg-slate-950 border border-slate-800 p-2 text-xs rounded-lg mt-1">
      </div>
      <button onclick="runAlightVerify()" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg text-xs">Verifikasi & Aktifkan Premium</button>
    </section>

    <!-- 2. AI CHAT -->
    <section id="view-ai" class="hidden max-w-md mx-auto w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
      <h3 class="font-bold text-center text-sm text-emerald-400">AI Assistant</h3>
      <select id="ai-ep" class="w-full bg-slate-950 border border-slate-800 p-2 text-xs rounded-lg"><option>Loading...</option></select>
      <textarea id="ai-prompt" rows="3" placeholder="Pesan / Pertanyaan..." class="w-full bg-slate-950 border border-slate-800 p-2 text-xs rounded-lg"></textarea>
      <button onclick="runGenericApi('ai-ep', 'ai-prompt', ['text', 'prompt', 'query', 'q'])" class="w-full bg-emerald-500 text-slate-950 font-bold py-2 rounded-lg text-xs">Kirim AI</button>
    </section>

    <!-- 3. STALKER & ANIME -->
    <section id="view-stalk" class="hidden max-w-md mx-auto w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
      <h3 class="font-bold text-center text-sm text-emerald-400">Stalker & Anime Search</h3>
      <select id="stalk-ep" class="w-full bg-slate-950 border border-slate-800 p-2 text-xs rounded-lg"><option>Loading...</option></select>
      <input type="text" id="stalk-q" placeholder="Username / ID / Judul Anime..." class="w-full bg-slate-950 border border-slate-800 p-2 text-xs rounded-lg">
      <button onclick="runGenericApi('stalk-ep', 'stalk-q', ['username', 'q', 'query', 'id', 'user'])" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg text-xs">Cari Data</button>
    </section>

    <!-- 4. MAKER & EDITOR -->
    <section id="view-maker" class="hidden max-w-md mx-auto w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
      <h3 class="font-bold text-center text-sm text-emerald-400">Image, Logo & Editor</h3>
      <select id="maker-ep" class="w-full bg-slate-950 border border-slate-800 p-2 text-xs rounded-lg"><option>Loading...</option></select>
      <input type="text" id="maker-txt" placeholder="Teks / Nama..." class="w-full bg-slate-950 border border-slate-800 p-2 text-xs rounded-lg">
      <button onclick="runGenericApi('maker-ep', 'maker-txt', ['text', 'nama', 'prompt', 'q'])" class="w-full bg-emerald-500 text-slate-950 font-bold py-2 rounded-lg text-xs">Generate</button>
    </section>

    <!-- 5. TOOLS -->
    <section id="view-tools" class="hidden max-w-md mx-auto w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
      <h3 class="font-bold text-center text-sm text-emerald-400">Tools & Utilities</h3>
      <select id="tools-ep" class="w-full bg-slate-950 border border-slate-800 p-2 text-xs rounded-lg"><option>Loading...</option></select>
      <input type="text" id="tools-txt" placeholder="Parameter (Query / IP / Link)..." class="w-full bg-slate-950 border border-slate-800 p-2 text-xs rounded-lg">
      <button onclick="runGenericApi('tools-ep', 'tools-txt', ['q', 'url', 'ip', 'text', 'link'])" class="w-full bg-emerald-500 text-slate-950 font-bold py-2 rounded-lg text-xs">Eksekusi Tool</button>
    </section>

    <!-- 6. ALL ENDPOINTS EXPLORER -->
    <section id="view-explorer" class="hidden grid grid-cols-1 md:grid-cols-3 gap-3">
      <div class="col-span-full text-center text-xs text-slate-500 py-6">Memuat seluruh daftar API...</div>
    </section>

    <!-- TERMINAL OUTPUT -->
    <div class="bg-slate-950 border border-slate-800 p-3 rounded-2xl font-mono text-xs">
      <div class="flex justify-between border-b border-slate-800 pb-1 mb-2 text-slate-500">
        <span>Console Terminal Output</span>
        <button onclick="document.getElementById('log').innerHTML=''" class="hover:text-slate-300">Clear</button>
      </div>
      <div id="log" class="text-emerald-400 min-h-[140px] max-h-[220px] overflow-y-auto space-y-1"></div>
    </div>
  </div>

  <script>
    const USER = 'reii', PASS = 'reii123';
    let BASE = 'https://api.kyzznekoo.my.id';

    function handleLogin(e) {
      e.preventDefault();
      if (document.getElementById('login-user').value === USER && document.getElementById('login-pass').value === PASS) {
        localStorage.setItem('session', USER); checkSession();
      } else { document.getElementById('login-error').classList.remove('hidden'); }
    }
    function handleLogout() { localStorage.removeItem('session'); checkSession(); }
    
    function checkSession() {
      const active = localStorage.getItem('session');
      document.getElementById('login-screen').className = active ? 'hidden' : 'fixed inset-0 bg-[#07090e] z-50 flex items-center justify-center p-4';
      document.getElementById('main-dashboard').className = active ? 'flex flex-col gap-4' : 'hidden';
      
      // Mengisi nilai input Host URL
      const savedUrl = localStorage.getItem('base_url');
      if (savedUrl) BASE = savedUrl;
      document.getElementById('base-url-input').value = BASE;

      // OTOMATIS AMBIL DATA DOCS SAAT DASHBOARD TERBUKA
      if (active) loadDocs();
    }

    function printLog(msg, isErr) {
      const l = document.getElementById('log'), p = document.createElement('p');
      p.className = (isErr ? 'text-rose-400' : 'text-emerald-400') + ' break-all';
      p.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
      l.appendChild(p); l.scrollTop = l.scrollHeight;
    }

    function saveBaseUrl() {
      BASE = document.getElementById('base-url-input').value.trim().replace(/\/+$/, '');
      localStorage.setItem('base_url', BASE); printLog('Base URL tersimpan: ' + BASE);
      loadDocs();
    }

    function switchTab(tab) {
      ['alight','ai','stalk','maker','tools','explorer'].forEach(v => document.getElementById('view-'+v).classList.add('hidden'));
      document.getElementById('view-'+tab).classList.remove('hidden');
    }

    async function executeCall(fullPath) {
      printLog('GET: ' + BASE + fullPath);
      try {
        let res = await fetch(BASE + fullPath).catch(() => fetch('https://corsproxy.io/?' + encodeURIComponent(BASE + fullPath)));
        let json = await res.json();
        printLog('RESULT:\n' + JSON.stringify(json, null, 2));
      } catch (e) { printLog('ERROR: ' + e.message, true); }
    }

    function runGenericApi(selectId, inputId, paramKeys) {
      const ep = document.getElementById(selectId).value;
      const val = document.getElementById(inputId).value.trim();
      if (!val) return printLog('Error: Masukkan teks / parameter terlebih dahulu!', true);
      
      let queryParams = paramKeys.map(k => `${k}=${encodeURIComponent(val)}`).join('&');
      executeCall(`${ep}?${queryParams}`);
    }

    function runAlightMagic() {
      const email = document.getElementById('am-email').value.trim();
      if (!email) return printLog('Error: Masukkan Email dulu!', true);
      executeCall(`/api/alightmotion/v3/magic-link?email=${encodeURIComponent(email)}`);
    }

    function runAlightVerify() {
      const email = document.getElementById('am-email').value.trim();
      const link = document.getElementById('am-link').value.trim();
      if (!email || !link) return printLog('Error: Email dan Link Verifikasi Wajib Diisi!', true);
      executeCall(`/api/alightmotion/v3/applyPremium?email=${encodeURIComponent(email)}&link=${encodeURIComponent(link)}`);
    }

    async function loadDocs() {
      printLog('Menghubungkan ke API server untuk memuat daftar menu...', false);
      try {
        let res = await fetch(BASE + '/api/docs').catch(() => fetch('https://corsproxy.io/?' + encodeURIComponent(BASE + '/api/docs')));
        let data = await res.json();

        // POPULATE DROPDOWN AUTOMATICALLY
        populateSelect('ai-ep', [...(data.ai||[]), ...(data.generator||[])]);
        populateSelect('stalk-ep', [...(data.stalk||[]), ...(data.anime||[]), ...(data.shinigami||[])]);
        populateSelect('maker-ep', [...(data.maker||[]), ...(data.img||[]), ...(data.editor||[])]);
        populateSelect('tools-ep', [...(data.tools||[]), ...(data.upscale||[]), ...(data.asupan||[])]);

        // RENDER EXPLORER GRID
        const grid = document.getElementById('view-explorer'); grid.innerHTML = '';
        Object.keys(data).filter(k => Array.isArray(data[k])).forEach(cat => {
          let card = document.createElement('div'); card.className = 'bg-slate-900 border border-slate-800 p-3 rounded-xl';
          card.innerHTML = `<h4 class="font-bold text-emerald-400 capitalize mb-1">${cat}</h4>` + 
            data[cat].map(ep => `<div onclick="executeCall('${ep}')" class="text-[11px] text-slate-300 truncate cursor-pointer py-0.5">${ep}</div>`).join('');
          grid.appendChild(card);
        });
        
        printLog('Sinkronisasi Sukses! Semua menu siap digunakan.', false);
      } catch(e) { 
        printLog('Gagal sinkronisasi menu otomatis dari server. Pastikan URL Server Benar.', true); 
      }
    }

    function populateSelect(id, list) {
      const s = document.getElementById(id);
      if (!s) return;
      s.innerHTML = '';
      if (!list || list.length === 0) { s.innerHTML = '<option>Tidak ada endpoint</option>'; return; }
      list.forEach(item => {
        let opt = document.createElement('option');
        opt.value = item; opt.innerText = item;
        s.appendChild(opt);
      });
    }

    // Jalankan pengecekan saat pertama kali aplikasi dibuka
    checkSession();
  </script>
</body>
</html>
